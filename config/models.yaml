# §9 / ADR-0023 `config/models.yaml` — the ONLY place a model id or a base_url may appear.
#
# Two levels: `roles` (a named job → capability tier, §9's table, essentially fixed) and
# `profiles` (tier → ordered backend targets, what an operator actually edits). `roles` below is
# `fleet.llm.roles.SPEC_ROLE_TIERS` verbatim — the harness's own "§9's roles: block as shipped"
# constant — so this file does not invent a routing table, it transcribes the real one.
#
# `profiles.default` targets the `anthropic` backend (native Messages API, no `base_url` needed)
# at real, current per-million-token prices (§9 rule 5 requires a declared price on every
# target). `api_key_env` names the environment variable the key is read from at call time
# (§9: "API keys come from the environment only") — never a key value.
version: 2
roles:
  conflict_resolution: HEAVY
  api_incompat_rewrite: HEAVY
  build_authoring: HEAVY
  cycle_break_proposal: HEAVY
  escalation: HEAVY
  transform_repair: WORKHORSE
  build_diagnosis: WORKHORSE
  manifest_extract: WORKHORSE
  pr_body: WORKHORSE
  repo_classify: CHEAP
  dep_disambiguate: CHEAP
  pr_title: CHEAP
default_profile: default
profiles:
  default:
    HEAVY:
      - { backend: anthropic, model_id: claude-opus-5, effort: high,
          api_key_env: ANTHROPIC_API_KEY,
          price: { in_per_mtok: 5.0, out_per_mtok: 25.0 } }
    WORKHORSE:
      - { backend: anthropic, model_id: claude-sonnet-5, effort: high,
          api_key_env: ANTHROPIC_API_KEY,
          price: { in_per_mtok: 3.0, out_per_mtok: 15.0 } }
    # No `effort:` on this target, deliberately — see ADR-0075 in docs/DECISIONS.md.
    #
    # The Anthropic reasoning-effort parameter's support on Haiku 4.5 is documented
    # inconsistently upstream (one page says the parameter itself is rejected, another says only
    # the `max` level is), and under the stricter reading every CHEAP call here would 4xx.
    # Omitting the line is now sufficient: `BackendTarget.effort` is optional and defaults to
    # `None`, which every backend MUST render as "send no effort parameter". It previously
    # defaulted to "medium", so deleting this line used to substitute a value the operator never
    # wrote — which did not fix the problem, it hid it.
    #
    # OPERATOR NOTE — expect ONE cold-cache dip on CHEAP, once, after upgrading past this change.
    # `effort` is a cache-key component, and CHEAP's contribution moved twice on the way here
    # (`low` -> `medium` -> absent). Existing CHEAP entries key on the old values and will not be
    # read again; they age out normally under `fleet gc --cache-max-age`. Correctness and cost per
    # call are unaffected — only the hit rate, and only until the cache refills. This is expected
    # and is not a cache bug.
    CHEAP:
      - { backend: anthropic, model_id: claude-haiku-4-5,
          api_key_env: ANTHROPIC_API_KEY,
          price: { in_per_mtok: 1.0, out_per_mtok: 5.0 } }

  # `profiles.local` is the all-local counterpart, routing every tier through
  # `openai_compatible` — the ANY-`base_url` transport (local vLLM / Ollama / LM Studio /
  # llama.cpp / TGI, and hosted OpenAI-compatible endpoints alike). Select it with
  # `--profile local` or `llm.profile`; `default_profile` above is unchanged.
  #
  # Four things this profile is asserting on purpose:
  #
  #   * `base_url` on every target. It is REQUIRED here (§13 row 36): a target without one is a
  #     startup error naming the profile, tier and target index, because this backend has no
  #     vendor default to fall back on. `http://localhost:8000/v1` is vLLM's default port —
  #     Ollama is `:11434/v1`, LM Studio `:1234/v1`; edit to match the server you run.
  #   * `price: free`, the LITERAL, not `{in_per_mtok: 0, out_per_mtok: 0}`. §9 rule 5 requires a
  #     declared price on every target, and `BackendTarget._free_is_declared_not_derived` rejects
  #     a zero-rate `Price` outright, so a locally-served model's $0.00 is something an operator
  #     wrote down rather than something the ledger inferred. `cost_usd = 0.0` with a non-empty
  #     `backend` is then a legitimate free call and not a fully-cached run (§11.2, §11.6).
  #   * No `api_key_env`. A target that names one and leaves it unset fails loud at the point of
  #     use; a target that omits it is declaring the endpoint needs no key, and the backend sends
  #     a placeholder so the servers that demand a non-empty dummy still answer. Add
  #     `api_key_env: LOCAL_LLM_API_KEY` (a variable NAME, never a key) if yours checks it.
  #   * `capabilities_override` where — and only where — the operator actually knows the server.
  #     The backend declares the honest floor (PROMPTED only), because `base_url` may point at
  #     anything; these overrides are the claim that THIS endpoint does better, and the gap
  #     between claim and delivery is what `CapabilityDrift` reports (§13 row 37).
  #
  # `model_id` is opaque to the harness and must match whatever your server advertises at
  # `GET /v1/models`; the ids below are placeholders for the vLLM-style served names.
  local:
    HEAVY:
      - { backend: openai_compatible, model_id: qwen3-coder-30b, effort: high, price: free,
          base_url: 'http://localhost:8000/v1',
          capabilities_override: { supports_json_schema: true, supports_tools: true,
                                   supports_constrained_decoding: true,
                                   max_context: 131072, max_output_tokens: 16384,
                                   structured_output_modes: [JSON_SCHEMA, TOOL_CALL, PROMPTED] } }
    WORKHORSE:
      - { backend: openai_compatible, model_id: qwen3-14b, effort: medium, price: free,
          base_url: 'http://localhost:8000/v1',
          capabilities_override: { supports_tools: true, supports_constrained_decoding: true,
                                   max_context: 32768, max_output_tokens: 8192,
                                   structured_output_modes: [TOOL_CALL, CONSTRAINED, PROMPTED] } }
    # CHEAP declares NO structured-output support, deliberately: `negotiate()` lands on
    # PROMPTED, validation is still Pydantic on our side (ADR-0002), and a small model that can
    # only be asked nicely stays a legitimate target. That is the whole point of this profile.
    #
    # `max_output_tokens` is nonetheless declared, and must be > `llm.default_max_output_tokens`
    # (4096). §13 row 47's truncation retry raises the cap on the SAME target and bounds the
    # raise by this number, so leaving it at the backend's 4096 default would make the first
    # `length` reply an immediate `BudgetExhausted` — the retry the spec promises would be
    # unreachable on this target rather than merely unused (`client.py` `_raise_cap`).
    CHEAP:
      - { backend: openai_compatible, model_id: qwen3-1.7b, effort: low, price: free,
          base_url: 'http://localhost:8000/v1',
          capabilities_override: { max_output_tokens: 8192 } }

  # `profiles.pilot` — §15.2 (Real-Repo Pilot Phase) prerequisite: "the corresponding `ModelClient`
  # backend registry entry and local-only pilot profile (mirroring §12.41's existing
  # local-only-profile precedent)". Unlike `local` (three differently-sized models, one per tier),
  # `pilot` routes all three tiers to ONE dedicated Spark host serving GPT-OSS-120b over Harmony
  # (ADR-0145) for every role. Uses the dedicated `harmony_gpt_oss` transport (ADR-0145), not
  # `openai_compatible`: GPT-OSS requires Harmony's token-id wire format, which is not an OpenAI
  # chat-completions JSON variation.
  #
  # PLACEHOLDER — both `model_id` and `base_url` MUST be edited once the Spark host is
  # provisioned and the real served model name is known (ADR-0145; same treatment as
  # `base_url` already had at the previous nemotron placeholder — this is not a new kind of
  # incompleteness, only a renamed one). `model_id` is prefixed `PLACEHOLDER_` rather than a
  # plausible-looking real name specifically so an operator who forgets to edit it gets a
  # loud, obviously-wrong string in every log line and cache key, not a quietly wrong one.
  #
  # No `capabilities_override` on any tier: harmony_gpt_oss's own declared_capabilities()
  # already claims TOOL_CALL unconditionally (a fact about the GPT-OSS model family, not this
  # endpoint) — see that method's docstring in
  # src/fleet/llm/backends/harmony_gpt_oss.py for why this differs from `local`'s
  # openai_compatible targets, which DO need overrides to claim anything above the honest
  # opaque-base_url floor.
  #
  # No `api_key_env` — same reasoning as `local`: unknown/unverified whether the eventual Spark
  # server requires one. Add `api_key_env: PILOT_LLM_API_KEY` (a variable NAME, never a key) if
  # the real server checks one.
  pilot:
    HEAVY:
      - { backend: harmony_gpt_oss, model_id: PLACEHOLDER_gpt-oss-120b, effort: high,
          price: free,
          base_url: 'http://pilot-spark.internal:8000/v1' }
    WORKHORSE:
      - { backend: harmony_gpt_oss, model_id: PLACEHOLDER_gpt-oss-120b, effort: medium,
          price: free,
          base_url: 'http://pilot-spark.internal:8000/v1' }
    CHEAP:
      - { backend: harmony_gpt_oss, model_id: PLACEHOLDER_gpt-oss-120b, effort: low,
          price: free,
          base_url: 'http://pilot-spark.internal:8000/v1' }
