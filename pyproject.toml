[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fleet"
version = "0.1.0"
description = "Polyglot monorepo migration harness: scan, transform, build, verify a 250-repo fleet."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Fleet Harness" }]
keywords = ["monorepo", "migration", "bazel", "ast-grep", "dependency-graph"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Pins per docs/DECISIONS.md: ADR-0002 (pydantic), ADR-0015 (typer), ADR-0016 (aiosqlite),
# ADR-0012 (structlog), ADR-0023 (model backends; supersedes ADR-0009), ADR-0004 (networkx).
#
# ADR-0023: no LangChain, no LangGraph, no DeepAgents, no LiteLLM — the ModelClient protocol
# (SPEC §7.7) is ~70 lines and each backend is one file. The two default-profile transports ship
# in the core dependency set; the two failover transports are extras, because a backend whose SDK
# is absent simply does not register and is a startup error only if the ACTIVE profile names it.
dependencies = [
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.7",
  "typer>=0.15",
  "aiosqlite>=0.20",
  "structlog>=24.4",
  "anthropic>=1.8.0",   # llm/backends/anthropic.py
  "openai>=1.60",      # llm/backends/openai_compatible.py — any base_url: local vLLM, Ollama,
                       #   LM Studio, llama.cpp, TGI, and hosted OpenAI-compatible endpoints.
                       #   The workhorse for local development on this host.
  "networkx>=3.7",
  "pyyaml>=6.0",
]

[project.scripts]
fleet = "fleet.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.168.0",
  # Exact pin, not a floor: `select` below lists family prefixes, so a future release adding
  # a rule reddens an untouched tree. `tests/test_lint_gate.py` gates and explains it.
  "ruff==0.16.8",
  "mypy>=1.13",
  # ADR-0141 security-scanning toolchain. Exact pins, same reasoning as ruff above — each of
  # these ships its own growing rule/advisory set, so a floor pin would let a future release
  # redden (or quiet) an untouched tree with no local change to explain it. `tools/bin/security-
  # scan` runs all three (plus gitleaks, a separate Go binary — see that script and ADR-0141).
  "bandit==1.9.4",
  "semgrep==1.177.0",
  "pip-audit==2.10.1",
]

[project.optional-dependencies]
# ADR-0023 failover transports. Same models, different transport; installed only if a profile
# routes a tier through them.
bedrock = ["boto3>=1.43.100"]
vertex = ["google-cloud-aiplatform>=1.70"]
# ADR-0145: the pilot profile's GPT-OSS-over-Harmony transport. Version floor matches the
# vendored reference crate's own version (references/harmony/Cargo.toml:3, 0.0.8) — the earliest
# version this plan's design was verified against; raise it once a newer PyPI release is
# confirmed compatible with the real Spark endpoint.
harmony = ["openai-harmony>=0.0.8"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.168.0",
  # Exact pin, not a floor: `select` below lists family prefixes, so a future release adding
  # a rule reddens an untouched tree. `tests/test_lint_gate.py` gates and explains it.
  "ruff==0.16.8",
  "mypy>=1.13",
  # ADR-0141 security-scanning toolchain — same exact-pin reasoning as ruff above.
  "bandit==1.9.4",
  "semgrep==1.177.0",
  "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.hatch.build.targets.sdist]
include = ["src/fleet", "tests", "docs", "config"]

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# NB: no --strict-config. `asyncio_mode` below is a pytest-asyncio ini key, and the smoke
# suite must stay runnable in a bare pydantic+pytest environment (it drives coroutines with
# asyncio.run rather than depending on the plugin).
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
# Pinned, not left to the default: pytest-asyncio warns that it is changing the async-fixture
# loop scope from "the fixture's own caching scope" to "function", and a fixture loop that
# silently widens is how one test's leftover tasks end up running inside the next one. Naming
# the future default now makes the change a no-op instead of a behaviour flip on upgrade.
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: touches real SQLite / git fixtures (still offline)",
  "contract: model round-trip and golden-schema checks",
]

# --------------------------------------------------------------------------------------
# coverage.py (SPEC.md §12.3: >=85% line coverage on src/fleet/). ARMED (round GG task 3):
# `fail_under = 85` below. `--cov` is still deliberately NOT added to the pytest addopts
# above — that would collect coverage on every targeted pytest invocation in this repo, and
# `src/fleet/orchestrator/budgets.py`'s CPU pool uses a real `forkserver` mp_context. That
# risk was investigated, not assumed: three independent whole-suite runs of
# `.venv/bin/python -m pytest --cov=fleet --cov-report=term-missing` completed cleanly
# (631s, 604s, 733s; no hang, no crash) and agreed on the total every time
# (17946 stmts, ~1195-1211 miss, branch ~4510/673-679, 91%) — coverage.py's default
# (non-multiprocessing) collector evidently sees everything that matters here, because the
# pool's one live callable (`workers/symbolindex.py`'s `scan_file`, per
# `docs/INTEGRATION_HONESTY.md`'s D86 analysis) is reached from tests that also exercise it
# in-process elsewhere in the suite. Full account, including the unrelated worktree-
# provisioning failures this investigation ran into and resolved: `docs/DECISIONS.md`
# ADR-0111. `--cov` in `addopts` is still avoided on general principle (coverage
# instrumentation slows every targeted single-test invocation for no benefit), not because of
# a measured forkserver failure. THIS is the invocation §12.3 measures — run it explicitly:
# `.venv/bin/python -m pytest --cov=fleet --cov-report=term-missing`.
# --------------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/fleet"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# --------------------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# `.superpowers/` holds round-ledger coordination scratch (worker/review briefs and reports) --
# never project source, not meant to participate in the lint/format gate. Controller ruling,
# round VIII Wave 14 (worker-ruff-drift-2 follow-up): a report's own illustrative code fence
# tripped `ruff format --check` and net-cancelled a same-round drift fix, the third time a
# round-ledger report has interacted with this pin -- excluding the whole tree closes the class
# rather than reformatting one file at a time.
exclude = [".superpowers"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "TID",       # tidy imports
  "PTH",       # use pathlib
  "RUF",       # ruff-specific
  "ASYNC",     # async antipatterns
  "S",         # bandit
  "ANN",       # missing annotations
  "TRY",       # tryceratops (Rule 11 — fail loud)
]
ignore = [
  "ANN401",  # Any is legitimate at the not-yet-implemented module boundary
  "TRY003",  # long messages inside raise are how we fail loud
]
# Typographic characters are deliberate: docstrings and comments quote SPEC.md prose verbatim,
# and mangling `×` into `x` or an em dash into `-` would make a citation stop matching its source.
allowed-confusables = ["×", "→", "—", "–", "’", "≥", "≤"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["fleet"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------------------
# mypy (strict)
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["fleet"]
strict = true
warn_unreachable = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = false
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ADR-0023 failover transports. `boto3` and `google-auth` are the `bedrock` / `vertex` EXTRAS
# (`[project.optional-dependencies]`), so on a host that installs neither — which is every host
# that does not route a tier through them — mypy cannot find them. None ships type stubs even when
# installed, so this override is unconditional rather than environment-dependent. It widens nothing
# else: `llm/backends/bedrock.py` and `llm/backends/vertex.py` are the only modules that may import
# them (§7.7, §12.40), and both re-read every response defensively.
#
# Enumerated to the exact subpackages imported rather than a blanket `google.*`: `google` is a
# namespace package several unrelated libraries publish into, and a wildcard over it would silence
# a genuinely missing import in some future first-party dependency. `requests` is here because it
# is a hard dependency of `google.auth.transport.requests` and `vertex.py` imports its exception
# base — it travels with the extra and is never a separate install.
#
# ADR-0145: `openai_harmony` is the `harmony` EXTRA — same pattern, same reasoning. Imported at
# module scope in `llm/backends/harmony_gpt_oss.py` only.
[[tool.mypy.overrides]]
module = [
  "boto3", "boto3.*", "botocore", "botocore.*",
  "google", "google.auth", "google.auth.*",
  "requests", "requests.*",
  "openai_harmony", "openai_harmony.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
